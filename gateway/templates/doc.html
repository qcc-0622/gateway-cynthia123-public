{% extends "base.html" %}
{% block title %}📖 维护文档{% endblock %}
{% block page_title %}📖 网关维护文档{% endblock %}
{% block page_sub %}{{ raw_path }}{% if mtime %} · 更新于 {{ mtime }}{% endif %}{% endblock %}

{% block content %}

<style>
  .doc-layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 24px;
    align-items: start;
  }
  .doc-toc {
    position: sticky;
    top: 80px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 12px;
  }
  .doc-toc .toctitle { display: none; }
  .doc-toc ul { list-style: none; padding-left: 0; margin: 0; }
  .doc-toc ul ul { padding-left: 14px; margin-top: 4px; }
  .doc-toc li { margin: 4px 0; }
  .doc-toc a {
    color: var(--text-2);
    text-decoration: none;
    line-height: 1.5;
    border-left: 2px solid transparent;
    padding-left: 8px;
    display: block;
  }
  .doc-toc a:hover { color: var(--accent-light); border-left-color: var(--accent); }
  .doc-content {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 36px;
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
    min-width: 0; /* 防止溢出 */
  }
  .doc-content h1 { font-size: 24px; margin: 12px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .doc-content h2 { font-size: 20px; margin: 28px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--bg-3); color: var(--accent-light); }
  .doc-content h3 { font-size: 16px; margin: 22px 0 10px; color: var(--text); }
  .doc-content h4 { font-size: 14px; margin: 16px 0 8px; color: var(--text-2); }
  .doc-content p { margin: 8px 0; }
  .doc-content ul, .doc-content ol { margin: 8px 0 8px 24px; }
  .doc-content li { margin: 4px 0; }
  .doc-content code {
    background: var(--bg-3);
    color: var(--accent-light);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 0.88em;
  }
  .doc-content pre {
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    overflow-x: auto;
    margin: 10px 0;
  }
  .doc-content pre code {
    background: none;
    padding: 0;
    color: var(--text-2);
    font-size: 12px;
    line-height: 1.6;
  }
  .doc-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 13px;
  }
  .doc-content thead th {
    background: var(--bg-3);
    text-align: left;
    padding: 8px 10px;
    border: 1px solid var(--border);
    font-weight: 600;
    color: var(--text-2);
  }
  .doc-content tbody td {
    padding: 8px 10px;
    border: 1px solid var(--bg-3);
    vertical-align: top;
  }
  .doc-content tbody tr:nth-child(even) { background: var(--bg-3); }
  .doc-content blockquote {
    border-left: 3px solid var(--accent);
    background: var(--accent-dim);
    margin: 10px 0;
    padding: 8px 14px;
    color: var(--text-2);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .doc-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .doc-content a { color: var(--accent-light); text-decoration: underline; }
  .doc-content a:hover { color: var(--text); }
  .doc-content :target { background: var(--accent-dim); padding: 2px 6px; border-radius: 4px; }

  @media (max-width: 768px) {
    .doc-layout { grid-template-columns: 1fr; }
    .doc-toc { position: relative; top: 0; max-height: 200px; }
    .doc-content { padding: 16px 18px; font-size: 13px; }
    .doc-content h1 { font-size: 20px; }
    .doc-content h2 { font-size: 17px; }
    .doc-content table { font-size: 11px; }
    .doc-content thead th, .doc-content tbody td { padding: 6px 8px; }
  }
</style>

<div class="doc-layout">
  {% if toc %}
  <aside class="doc-toc">
    <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">目录</div>
    {{ toc|safe }}
  </aside>
  {% endif %}
  <article class="doc-content">
    {{ html|safe }}
  </article>
</div>

{% endblock %}
